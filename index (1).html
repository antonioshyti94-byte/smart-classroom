<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Classroom TFT</title><style>body{margin:0;background:#10151c;color:white;font:14px monospace;display:flex;align-items:center;flex-direction:column;padding:16px}canvas{width:min(100%,480px);height:auto;background:black;touch-action:manipulation;border:10px solid #20252b;border-radius:12px;box-sizing:border-box}p{max-width:480px;color:#b8c8da;min-height:32px}</style></head><body><canvas id="screen" width="480" height="640" aria-label="Smart Classroom: parametrat dhe komandat"></canvas><p id="message" role="status">Duke u lidhur...</p><script>
const c=document.getElementById('screen'),ctx=c.getContext('2d'),msg=document.getElementById('message');ctx.scale(2,2);
let data=null,page='dashboard',param=0,mode=0,series=[],busy=false,graphBusy=false;
const names=['Temp','Humidity','Pressure','VOC','Light','Noise','Flame','MQ135'];
const keys=['temp','hum','pres','voc','light','noise','flame','mq135'];
const units=['C','%','hPa','kO','%','%','%','%'];
const blue='#0000ff',grey='#7b8585';
function text(t,x,y,size=8,color='white'){ctx.fillStyle=color;ctx.font=size+'px monospace';ctx.textBaseline='top';ctx.fillText(String(t),x,y);}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function button(x,y,w,h,color,label){ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=1;ctx.stroke();text(label,x+6,y+h/2-4);}
function number(v,d){return typeof v==='number'&&Number.isFinite(v)?v.toFixed(d):'--';}
function draw(){rect(0,0,240,320,'black');if(!data){text('Duke lexuar pajisjen...',12,140);return;}if(page==='graph'){drawGraph();return;}
 const d=data;rect(0,0,240,58,d.alarmActive?'#ff0000':'#008b8b');text('Smart Classroom',10,5,20);text(d.date+' '+d.time,10,28);text(d.batteryOK?number(d.batteryVoltage,2)+'V':'BAT ?',180,28);text('WiFi:'+(d.wifiOK?'OK':'X')+' BME:'+(d.bmeOK?'OK':'X'),10,44);text('SD:'+(d.sdOK?'OK':'X')+' TS:'+(d.tsOK?'OK':'X'),110,44);text(d.batteryOK?d.batteryPercent+'%':'',190,44);
 const titles=['T Temp','H Hum','P Pres','VOC','D Light','N Noise','F Flame','G Gas'];
 for(let i=0;i<8;i++){const x=i<4?10:130,y=62+(i%4)*38;const ready=i<4?d.bmeOK:d.adsOK;const value=ready?number(d[keys[i]],i<4?1:0):'--';button(x,y,100,36,d.warnings[i]?'#ff0000':blue,'');text(titles[i],x+5,y+4);text(value,x+5,y+14,20);text(units[i],x+72,y+22);}
 rect(0,214,240,1,'#666');const on=v=>v?'ON':'OFF';text('L:'+on(d.out1),8,220);text('FAN:'+on(d.out2),58,220);text('P:'+on(d.out3),118,220);text('BZ:'+on(d.out4),158,220);text(d.auto?'A':'M',205,220);
 button(5,242,72,22,d.out1?'#00ff00':grey,'LIGHT');button(84,242,72,22,d.out2?'#00ff00':grey,'FAN');button(163,242,72,22,d.out3?'#00ff00':grey,'PUMP');button(5,270,72,22,d.out4?'red':grey,'BUZZ');button(84,270,72,22,d.auto?blue:grey,'AUTO');button(163,270,72,22,'#ffbb00','ALL OFF');text('ALARM: '+d.alarm,5,302,8,d.alarmActive?'red':'white');
}
function drawGraph(){rect(0,0,240,34,'#000080');text('GRAPH',8,8,20);text(names[param],120,10);button(5,38,50,22,'#006400','BACK');button(62,38,40,22,mode===0?blue:grey,'LIVE');button(108,38,36,22,mode===1?blue:grey,'1H');button(150,38,44,22,mode===2?blue:grey,'24H');button(200,38,35,22,'#008b8b','>');button(200,66,35,22,'#008b8b','<');
 const gx=44,gy=88,gw=178,gh=138;ctx.strokeStyle='white';ctx.strokeRect(gx,gy,gw,gh);
 const ignoreZero=param<4;const valid=series.filter(v=>typeof v==='number'&&Number.isFinite(v)&&!(ignoreZero&&v===0));
 if(valid.length<2){text(graphBusy?'LOADING':'NO DATA',60,170,16,'yellow');return;}
 const min=Math.min(...valid),max=Math.max(...valid),avg=valid.reduce((a,b)=>a+b,0)/valid.length;
 let span=max-min;if(span<.001)span=1;const rough=span/4,power=10**Math.floor(Math.log10(rough)),fraction=rough/power,step=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power;let low=Math.floor(min/step)*step,high=Math.ceil(max/step)*step;if(high-low<.001)high=low+1;
 for(let i=0;i<5;i++){const val=low+(high-low)*i/4,yy=gy+gh-1-i*(gh-1)/4;text(number(val,Math.abs(high-low)<10?1:0),2,yy-4);}
 for(let i=0;i<4;i++){const xx=gx+(gw-1)*i/3;let label;if(mode===0)label='-'+Math.round((series.length-1)*2*(1-i/3))+'s';else {let hours=mode===1?1:24;const date=new Date((data.epoch||Date.now()/1000)*1000-hours*3600000*(1-i/3));label=date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Tirane'});}text(label,Math.min(210,xx-8),gy+gh+8);}
 ctx.strokeStyle='#00ff00';ctx.beginPath();let connected=false;series.forEach((v,i)=>{if(typeof v!=='number'||!Number.isFinite(v)||(ignoreZero&&v===0)){connected=false;return;}const x=gx+i*(gw-1)/(series.length-1),y=gy+gh-1-(v-low)*(gh-1)/(high-low);if(connected)ctx.lineTo(x,y);else ctx.moveTo(x,y);connected=true;});ctx.stroke();rect(0,252,240,1,'#666');text('Param: '+names[param]+' ('+units[param]+')',6,258);text('MIN: '+number(min,1),6,274);text('AVG: '+number(avg,1),82,274);text('MAX: '+number(max,1),162,274);text('Mode: '+['LIVE','1H','24H'][mode],6,292);
}
async function request(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(path,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(timer);}}
async function getGraph(){if(graphBusy)return;graphBusy=true;const p=param,m=mode;try{const r=await request('/webgraph?p='+p+'&m='+m);if(page==='graph'&&p===param&&m===mode)series=r.values;}finally{graphBusy=false;}draw();}
async function poll(){if(!busy){try{data=await request('/all');draw();if(page==='graph')await getGraph();msg.textContent='Lidhur me '+location.host;}catch(e){msg.textContent='Lidhja u nderpre. Vlerat mund te jene te vjetra.';}}setTimeout(poll,2500);}
c.addEventListener('click',async event=>{if(!data||busy)return;const b=c.getBoundingClientRect(),x=(event.clientX-b.left-c.clientLeft)/(c.clientWidth)*240,y=(event.clientY-b.top-c.clientTop)/(c.clientHeight)*320;
 if(page==='dashboard'){
  for(let row=0;row<4;row++){if(y>=62+row*38&&y<=98+row*38){if(x>=10&&x<=110)param=row;else if(x>=130&&x<=230)param=row+4;else continue;page='graph';series=[];draw();try{await getGraph();}catch(e){msg.textContent='Grafiku nuk u lexua.';}return;}}
  if(!((y>=242&&y<=264)||(y>=270&&y<=292)))return;if(!((x>=5&&x<=77)||(x>=84&&x<=156)||(x>=163&&x<=235)))return;
  busy=true;try{data=await request('/webtouch?x='+Math.floor(x)+'&y='+Math.floor(y));draw();msg.textContent='Komanda u zbatua. Buzzeri ndjek gjendjen e alarmit.';}catch(e){msg.textContent='Komanda nuk u konfirmua. Kontrollo pajisjen.';}finally{busy=false;}return;
 }
 let changed=false;if(y>=38&&y<=60){if(x>=5&&x<=55){page='dashboard';draw();return;}if(x>=62&&x<=102){mode=0;changed=true;}else if(x>=108&&x<=144){mode=1;changed=true;}else if(x>=150&&x<=194){mode=2;changed=true;}else if(x>=200&&x<=235){param=(param+1)%8;changed=true;}}
 if(y>=66&&y<=88&&x>=200&&x<=235){param=(param+7)%8;changed=true;}if(changed){series=[];draw();try{await getGraph();}catch(e){msg.textContent='Grafiku nuk u lexua.';}}
});draw();poll();
</script></body></html>
